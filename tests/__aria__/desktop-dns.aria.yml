- main:
  - complementary:
    - text: CFST-GUI
    - button "折叠侧边栏":
      - img
    - navigation "Desktop sections":
      - button "任务看板":
        - img
        - paragraph: 任务看板
        - paragraph: 运行状态、进度条与测试进程
      - button "当前结果":
        - img
        - paragraph: 当前结果
        - paragraph: 本次测速结果、排序与导出位置
      - button "输入源":
        - img
        - paragraph: 输入源
        - paragraph: 全局保存的来源、状态与 IP 模式
      - button "系统配置":
        - img
        - paragraph: 系统配置
        - paragraph: Cloudflare、导出与探测参数
      - button "DNS 读取":
        - img
        - paragraph: DNS 读取
        - paragraph: 读取当前域名与子域名记录
    - text: 服务已连接 桌面版 Vtest
  - heading "DNS 记录读取" [level=1]
  - article:
    - heading "DNS 记录读取" [level=3]:
      - img
      - text: ""
    - paragraph: 读取当前域名或指定子域名的 DNS 记录。使用前请先在“系统配置”中填写 Cloudflare 信息。
    - button "读取记录":
      - img
      - text: ""
    - button "当前域名全部记录 读取当前域名的全部 DNS 记录"
    - button "当前配置记录 读取 Cloudflare 配置里的记录名"
    - button "指定子域名 读取你输入的指定子域名记录"
    - img
    - text: 筛选 记录类型
    - combobox "记录类型":
      - option "全部类型" [selected]
      - option "仅 A"
      - option "仅 AAAA"
    - paragraph: 默认读取所有类型；选择 A/AAAA 时会把类型条件直接传给 Cloudflare 官方 API。
  - article:
    - heading "线上记录" [level=3]
    - paragraph: 当前读取条件下匹配的 Cloudflare DNS 记录快照。
    - text: 0 条记录
    - table:
      - rowgroup:
        - row "类型 名称 内容 TTL 代理 备注":
          - columnheader "类型"
          - columnheader "名称"
          - columnheader "内容"
          - columnheader "TTL"
          - columnheader "代理"
          - columnheader "备注"
      - rowgroup:
        - row "还没有记录。先确认已填写 Cloudflare 信息，再点击上方“读取记录”。":
          - cell "还没有记录。先确认已填写 Cloudflare 信息，再点击上方“读取记录”。"