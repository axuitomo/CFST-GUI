- main:
  - complementary:
    - text: CFST-GUI
    - button "折叠侧边栏":
      - img
    - navigation "Desktop sections":
      - button "任务看板":
        - img
        - paragraph: 任务看板
        - paragraph: 运行状态、进度条与测试进程
      - button "当前结果":
        - img
        - paragraph: 当前结果
        - paragraph: 本次测速结果、排序与导出位置
      - button "输入源":
        - img
        - paragraph: 输入源
        - paragraph: 本次任务要读的输入源、启用状态与 IP 模式
      - button "系统配置":
        - img
        - paragraph: 系统配置
        - paragraph: Cloudflare、导出与探测参数
      - button "DNS 读取":
        - img
        - paragraph: DNS 读取
        - paragraph: 读取当前域名与子域名记录
    - text: 服务已连接 桌面版 Vtest
  - heading "DNS 记录读取" [level=1]
  - article:
    - heading "DNS 记录读取" [level=3]:
      - img
      - text: ""
    - paragraph: 读取所选平台当前域名或指定子域名的 DNS 记录。切换平台只影响读取，不会改动推送目标。
    - button "读取记录":
      - img
      - text: ""
    - text: 读取平台
    - combobox "读取平台 只影响本次读取，不会改动任何推送记录。":
      - option "Cloudflare" [selected]
    - paragraph: 只影响本次读取，不会改动任何推送记录。
    - button "当前域名全部记录 读取当前域名的全部 DNS 记录"
    - button "当前配置记录 读取所选平台配置里的记录名"
    - group "当前配置记录的读取来源":
      - button "主记录名" [pressed]
      - button "分流记录名"
    - button "指定子域名 读取你输入的指定子域名记录"
    - img
    - text: 筛选 记录类型
    - combobox "记录类型":
      - option "全部类型" [selected]
      - option "仅 A"
      - option "仅 AAAA"
    - paragraph: 默认读取所有类型；平台支持服务端筛选时直接下推，否则在本地按类型过滤。
  - article:
    - heading "线上记录" [level=3]
    - paragraph: 当前读取条件下匹配的 Cloudflare DNS 记录快照。
    - text: 0 条记录
    - table:
      - rowgroup:
        - row "类型 名称 内容 TTL 代理 备注":
          - columnheader "类型"
          - columnheader "名称"
          - columnheader "内容"
          - columnheader "TTL"
          - columnheader "代理"
          - columnheader "备注"
      - rowgroup:
        - row "还没有记录。 先选择平台并在系统配置中补全凭据，再点击上方“读取记录”。 去系统配置":
          - cell "还没有记录。 先选择平台并在系统配置中补全凭据，再点击上方“读取记录”。 去系统配置":
            - paragraph: 还没有记录。
            - paragraph: 先选择平台并在系统配置中补全凭据，再点击上方“读取记录”。
            - button "去系统配置"
  - article:
    - heading "DNS 平台自检" [level=3]:
      - img
      - text: ""
    - paragraph: 读取、上传、幂等、换血、属性更新与 CNAME 拦截/替换，全部只落在测试记录名上，跑完自动清理。
    - text: 不会触碰推送记录名 测试平台
    - combobox "测试平台" [disabled]
    - text: 测试记录名
    - textbox "测试记录名":
      - /placeholder: cfst-selftest.example.com
    - paragraph: 请先选择 DNS 推送平台
    - text: 自检会真实调用平台 API，并临时写入、更新、删除上述测试记录名下的记录。若中途失败，会在阶段详情里列出残留记录，按 id 手动清理即可。
    - checkbox "我确认在测试记录名上执行真实写入"
    - text: 我确认在测试记录名上执行真实写入
    - button "开始自检" [disabled]:
      - img
      - text: ""