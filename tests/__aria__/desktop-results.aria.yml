- main:
  - complementary:
    - text: CFST-GUI
    - button "折叠侧边栏":
      - img
    - navigation "Desktop sections":
      - button "任务看板":
        - img
        - paragraph: 任务看板
        - paragraph: 运行状态、进度条与测试进程
      - button "当前结果":
        - img
        - paragraph: 当前结果
        - paragraph: 本次测速结果、排序与导出位置
      - button "输入源":
        - img
        - paragraph: 输入源
        - paragraph: 全局保存的来源、状态与 IP 模式
      - button "系统配置":
        - img
        - paragraph: 系统配置
        - paragraph: Cloudflare、导出与探测参数
      - button "DNS 读取":
        - img
        - paragraph: DNS 读取
        - paragraph: 读取当前域名与子域名记录
    - text: 服务已连接 桌面版 Vtest
  - heading "当前测速结果" [level=1]
  - article:
    - paragraph: 当前结果
    - strong: "0"
  - article:
    - paragraph: 有效结果
    - strong: "0"
  - article:
    - paragraph: 失败结果
    - strong: "0"
  - article:
    - heading "当前测速结果" [level=3]:
      - img
      - text: ""
    - paragraph: 新任务或单条重测会清空这里，仅展示当前任务结果。
    - button "刷新":
      - img
      - text: ""
    - text: IP 版本
    - combobox "IP 版本":
      - option "全部 IP" [selected]
      - option "仅 IPv4"
      - option "仅 IPv6"
    - text: 排序
    - combobox "排序":
      - option "TCP 延迟"
      - option "追踪延迟"
      - option "平均速率" [selected]
      - option "最高速率"
    - text: 方向
    - combobox "方向":
      - option "升序"
      - option "降序" [selected]
    - text: 任务：等待中 状态：等待中 阶段：就绪 会话：仅恢复快照 全局端口：- 源端口：未指定 实际测速端口：- 更新：-
    - table:
      - rowgroup:
        - row "IP 地址 输入源端口 实际测速端口 阶段状态 TCP 追踪 平均速率 最高速率 操作":
          - columnheader "IP 地址"
          - columnheader "输入源端口"
          - columnheader "实际测速端口"
          - columnheader "阶段状态"
          - columnheader "TCP"
          - columnheader "追踪"
          - columnheader "平均速率"
          - columnheader "最高速率"
          - columnheader "操作"
      - rowgroup:
        - row "还没有测速结果。先到“输入源”添加一个来源，再回到任务看板点击“开始测速”。":
          - cell "还没有测速结果。先到“输入源”添加一个来源，再回到任务看板点击“开始测速”。"