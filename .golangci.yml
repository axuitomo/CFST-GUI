version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive

  settings:
    revive:
      rules:
        - name: exported
          severity: warning

    # Go 侧分层依赖硬约束：依赖只允许 L4 -> L3 -> L2 -> L1 单向向下流动。
    # 规则按目录划分，import 路径前缀匹配；以 `$` 结尾表示精确匹配，
    # 以目录前缀 + `/` 结尾表示该子包树。
    # 新增 Go 包时必须同时归入下面某一层，并补进对应 deny 列表，否则该包不受约束。
    depguard:
      rules:
        # L1 基础设施层：纯技术底座，零业务语义，不感知平台与领域。
        l1-infrastructure:
          files:
            - "**internal/kernel/infra/**"
          deny:
            - pkg: "github.com/axuitomo/CFST-GUI/internal/kernel/appcore$"
              desc: "L1 基础设施层禁止导入 L3 应用编排层 internal/kernel/appcore；请把依赖改为接口/回调注入，或由 appcore 在上层组合这些底座能力。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/kernel/appcore/"
              desc: "L1 基础设施层禁止导入 L3 应用编排层 internal/kernel/appcore/...。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/kernel/domain/"
              desc: "L1 基础设施层禁止导入 L2 领域能力层 internal/kernel/domain/...；领域业务语义必须留在 L2，底座只提供通用技术能力。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters$"
              desc: "L1 基础设施层禁止导入 L4 桌面/WebUI 适配层 internal/adapters；基础设施不得感知 Wails、窗口、托盘、HTTP 传输等平台能力。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/"
              desc: "L1 基础设施层禁止导入 L4 适配层子包 internal/adapters/...（如 host/desktop/webui/wailsruntime）；请把与平台无关的能力留在 L1。"
            - pkg: "github.com/axuitomo/CFST-GUI/apps/android/bridge/mobileapi$"
              desc: "L1 基础设施层禁止导入 L4 Android 桥 mobileapi；基础设施不得感知端侧桥接与 gomobile 传输。"
            - pkg: "github.com/axuitomo/CFST-GUI/apps/android/bridge/mobileapi/"
              desc: "L1 基础设施层禁止导入 L4 Android 桥子包 mobileapi/...。"
            - pkg: "github.com/axuitomo/CFST-GUI/apps/android/bridge/sqlitegate$"
              desc: "L1 基础设施层禁止导入 L4 Android SQLite 验证入口 sqlitegate。"

        # L2 领域能力层：业务语义，不感知桌面/WebUI/Android 任一端。
        l2-domain:
          files:
            - "**internal/kernel/domain/**"
          deny:
            - pkg: "github.com/axuitomo/CFST-GUI/internal/kernel/appcore$"
              desc: "L2 领域能力层禁止反向依赖 L3 应用编排层 internal/kernel/appcore（会形成 appcore -> 领域包 -> appcore 循环）；请把共享类型下沉到领域包/底层包，或由 appcore 通过接口注入回调。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/kernel/appcore/"
              desc: "L2 领域能力层禁止反向依赖 L3 应用编排层 internal/kernel/appcore/...。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters$"
              desc: "L2 领域能力层禁止导入 L4 桌面/WebUI 适配层 internal/adapters；领域逻辑必须三端复用，不得感知 Wails、窗口或托盘。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/"
              desc: "L2 领域能力层禁止导入 L4 适配层子包 internal/adapters/...；领域包不得绑定平台运行时。"
            - pkg: "github.com/axuitomo/CFST-GUI/apps/android/bridge/mobileapi$"
              desc: "L2 领域能力层禁止导入 L4 Android 桥 mobileapi；端侧桥只能调用领域能力，领域能力不得反向调用壳层。"
            - pkg: "github.com/axuitomo/CFST-GUI/apps/android/bridge/mobileapi/"
              desc: "L2 领域能力层禁止导入 L4 Android 桥子包 mobileapi/...。"
            - pkg: "github.com/axuitomo/CFST-GUI/apps/android/bridge/sqlitegate$"
              desc: "L2 领域能力层禁止导入 L4 壳层 sqlitegate。"

        # L3 应用编排层：唯一有状态跨端 Service，可调用 L2/L1，不得回头依赖任何端壳。
        l3-application:
          files:
            - "**internal/kernel/appcore/**"
          deny:
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters$"
              desc: "L3 应用编排层禁止导入 L4 桌面/WebUI 适配层 internal/adapters；调用方向只能是适配层 -> appcore，反向依赖会形成循环并把 Wails 依赖拖进跨端共享核心。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/"
              desc: "L3 应用编排层禁止导入 L4 适配层子包 internal/adapters/...；appcore 必须与 Wails/HTTP 运行时无关。"
            - pkg: "github.com/axuitomo/CFST-GUI/apps/android/bridge/mobileapi$"
              desc: "L3 应用编排层禁止导入 L4 Android 桥 mobileapi；appcore 是三端共享服务，gomobile 传输只能在 mobileapi 内完成。"
            - pkg: "github.com/axuitomo/CFST-GUI/apps/android/bridge/mobileapi/"
              desc: "L3 应用编排层禁止导入 L4 Android 桥子包 mobileapi/...。"
            - pkg: "github.com/axuitomo/CFST-GUI/apps/android/bridge/sqlitegate$"
              desc: "L3 应用编排层禁止导入 L4 壳层 sqlitegate。"

        # L4 端侧适配层：宿主/桌面/WebUI、Android 与安装器壳层互相隔离，只共享 L3/L2/L1。
        l4-desktop-shell:
          files:
            - "**internal/adapters/**"
          deny:
            - pkg: "github.com/axuitomo/CFST-GUI/apps/android/bridge/mobileapi$"
              desc: "桌面/WebUI 适配层禁止导入 L4 Android 桥 mobileapi；两端壳层必须彼此隔离，共用逻辑下沉到 internal/kernel/appcore。"
            - pkg: "github.com/axuitomo/CFST-GUI/apps/android/bridge/mobileapi/"
              desc: "桌面/WebUI 适配层禁止导入 Android 桥子包 mobileapi/...；桌面构建不得携带 gomobile 传输实现。"
            - pkg: "github.com/axuitomo/CFST-GUI/apps/android/bridge/sqlitegate$"
              desc: "桌面/WebUI 适配层禁止导入 Android SQLite 验证入口 sqlitegate。"

        l4-host-adapter:
          files:
            - "**internal/adapters/host/**"
          deny:
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/desktop$"
              desc: "共享宿主层 host 禁止反向导入 desktop 适配层。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/desktop/"
              desc: "共享宿主层 host 禁止导入 desktop 子包。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/webui$"
              desc: "共享宿主层 host 禁止反向导入 webui 适配层。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/webui/"
              desc: "共享宿主层 host 禁止导入 webui 子包。"
            - pkg: "github.com/wailsapp/wails"
              desc: "共享宿主层 host 禁止依赖 Wails 运行时，保持 desktop 与 webui 纯净分离。"

        l4-desktop-adapter:
          files:
            - "**internal/adapters/desktop/**"
          deny:
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/webui$"
              desc: "desktop 适配层禁止导入 webui 适配层。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/webui/"
              desc: "desktop 适配层禁止导入 webui 子包。"

        l4-webui-adapter:
          files:
            - "**internal/adapters/webui/**"
          deny:
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/desktop$"
              desc: "webui 适配层禁止导入 desktop 适配层。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/desktop/"
              desc: "webui 适配层禁止导入 desktop 子包。"
            - pkg: "github.com/wailsapp/wails"
              desc: "webui 适配层禁止依赖 Wails 桌面运行时。"

        l4-desktop-entry:
          files:
            - "**apps/desktop/**"
          deny:
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/webui$"
              desc: "apps/desktop 入口禁止导入 webui 适配层。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/webui/"
              desc: "apps/desktop 入口禁止导入 webui 子包。"

        l4-webui-entry:
          files:
            - "**apps/webui/**"
          deny:
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/desktop$"
              desc: "apps/webui 入口禁止导入 desktop 适配层。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/desktop/"
              desc: "apps/webui 入口禁止导入 desktop 子包。"
            - pkg: "github.com/wailsapp/wails"
              desc: "apps/webui 入口禁止依赖 Wails 桌面运行时。"

        l4-installer-shell:
          files:
            - "**apps/installer/**"
          deny:
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters$"
              desc: "Windows 安装器壳层禁止导入桌面/WebUI 适配层 internal/adapters；共享能力请走 internal/kernel/...。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/"
              desc: "Windows 安装器壳层禁止导入 internal/adapters/...。"
            - pkg: "github.com/axuitomo/CFST-GUI/apps/android/bridge/mobileapi$"
              desc: "Windows 安装器壳层禁止导入 Android 桥 mobileapi。"
            - pkg: "github.com/axuitomo/CFST-GUI/apps/android/bridge/mobileapi/"
              desc: "Windows 安装器壳层禁止导入 mobileapi/...。"

        l4-sqlitegate-shell:
          files:
            - "**apps/android/bridge/sqlitegate/**"
          deny:
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters$"
              desc: "sqlitegate 只验证 L1 sqliteprobe，禁止导入 L4 桌面适配层 internal/adapters。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/"
              desc: "sqlitegate 禁止导入 internal/adapters/...。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/kernel/appcore$"
              desc: "sqlitegate 只依赖 L1 sqliteprobe，禁止导入 L3 appcore。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/kernel/domain/"
              desc: "sqlitegate 只依赖 L1 sqliteprobe，禁止导入 L2 领域包。"

        # 跨层兜底：除 Android 桥自身（不会自导入）与跨端契约测试外，
        # 全仓任何 Go 文件都不许导入 mobileapi，桌面构建不得被拖进 gomobile 依赖。
        # 用 "**/*.go" 而非逐目录列举的原因：depguard 的 files 只认带 "**/" 前缀的写法，
        # 裸 "*.go" 匹配不到仓库根入口，会让根入口成为治理盲区。
        mobileapi-isolation:
          files:
            - "**/*.go"
          deny:
            - pkg: "github.com/axuitomo/CFST-GUI/apps/android/bridge/mobileapi$"
              desc: "除 Android 桥 mobileapi 自身外，任何 Go 代码（含 apps/desktop、apps/webui、apps/installer、领域包、测试）都禁止导入 mobileapi；桌面与 WebUI 构建不得携带 gomobile 传输。跨端契约测试请走 internal/contracttest 的豁免。"
            - pkg: "github.com/axuitomo/CFST-GUI/apps/android/bridge/mobileapi/"
              desc: "除 Android 桥 mobileapi 自身外，禁止导入 mobileapi 的任何子包；共用逻辑必须下沉到 internal/kernel/appcore。"

        l4-mobile-shell:
          files:
            - "**apps/android/bridge/mobileapi/**"
          deny:
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters$"
              desc: "Android 桥 mobileapi 禁止导入 L4 桌面/WebUI 适配层 internal/adapters；mobileapi 只能调用 internal/kernel/... 共享核心，桌面 Wails 依赖不得进入 Android 构建。"
            - pkg: "github.com/axuitomo/CFST-GUI/internal/adapters/"
              desc: "Android 桥 mobileapi 禁止导入 L4 适配层子包 internal/adapters/...（如 wailsruntime）；gomobile 传输不得携带 Wails 运行时。"

  exclusions:
    generated: lax
    rules:
      # 跨端契约测试豁免：internal/contracttest 目前只有 _test.go，职责就是同时驱动
      # 桌面壳与 Android 桥，必须允许导入 mobileapi。若将来加入非测试代码，
      # 必须把该包登记进 depguard 层级并删除这条豁免。
      - path: internal/contracttest/
        linters:
          - depguard
      # Test files: tolerated before test helpers are introduced.
      - path: _test\.go$
        linters:
          - errcheck
          - unused
      # Revive "exported" is doc/naming debt, not a code gap: 56 existing.
      - linters:
          - revive
        text: "exported: .*"
      # fmt/console printing errors are conventionally ignored: 10 existing.
      - linters:
          - errcheck
        text: "Error return value of .*\\.(Print|Printf|Println|Scanln).* is not checked"
      # Resource Close errors: tracked as a review list, not a gate (24 existing).
      - linters:
          - errcheck
        text: "Error return value of .*\\.Close.* is not checked"
      # ST1005 misfires on Chinese error strings (uppercase detection):
      # "Android APK 安装必须…" is flagged though Chinese has no case (3 existing).
      - linters:
          - staticcheck
        text: "ST1005:"
      # unused: 10 are Wails v3 runtime bridge symbols (loaded reflectively),
      # 18 are dead-code candidates tracked in lint-gap-report.html (28 existing).
      - linters:
          - unused
        text: "(field|func|var|type|const) .* is unused"

formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
