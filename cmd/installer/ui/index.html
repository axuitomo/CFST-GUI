<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CFST-GUI 安装程序</title>
<style>
  /* 设计变量：瑞士网格 / 工业极客风。改色只改这里。 */
  :root {
    --canvas: #09090b;
    --surface: #121215;
    --surface-2: #18181b;
    --border: #27272a;
    --border-strong: #3f3f46;
    --border-active: #52525b;
    --text: #fafafa;
    --muted: #71717a;
    --muted-2: #a1a1aa;
    --accent: #f38020;
    --ok: #10b981;
    --warn: #f59e0b;
    --danger: #dc2626;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
    --sans: Inter, "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 560px;
    height: 380px;
    overflow: hidden;
    background: var(--canvas);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }

  .app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }

  /* ── 标题栏：无边框窗口，整条可拖动；关闭按钮不可拖动 ───────────────── */
  .titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 34px;
    padding-left: 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    --wails-draggable: drag;
    flex: none;
  }
  .brand-icon { width: 13px; height: 13px; flex: none; color: var(--accent); }
  .brand {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .08em;
    color: #e4e4e7;
  }
  .brand .slash { color: var(--border-active); }
  .spacer { flex: 1; }
  .version {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    letter-spacing: .04em;
  }
  .win-close {
    width: 38px;
    height: 34px;
    margin-left: 6px;
    border: 0;
    background: transparent;
    color: var(--muted-2);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1;
    display: grid;
    place-items: center;
    --wails-draggable: no-drag;
    cursor: default;
  }
  .win-close:hover { background: var(--danger); color: #fff; }

  /* ── 主体 ─────────────────────────────────────────────────────────── */
  main {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 18px 0;
    flex: 1;
    min-height: 0;
  }

  .hero {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 2px;
  }
  .hero h1 {
    margin: 0;
    font-size: 22px;
    line-height: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .hero .sub {
    margin: 4px 0 0;
    font-size: 12.5px;
    line-height: 16px;
    color: var(--muted-2);
    letter-spacing: .01em;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 22px;
    padding: 0 10px 0 8px;
    margin-top: 2px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .06em;
    color: var(--muted-2);
    white-space: nowrap;
    flex: none;
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  .pill[data-state="missing"] .dot { background: var(--warn); }
  .pill[data-state="missing"] { color: var(--warn); border-color: #3a2a13; }

  /* 分区标题：编号用强调色 */
  .label {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .label em { font-style: normal; color: var(--accent); }

  /* 终端风路径行 */
  .fieldrow { display: flex; gap: 6px; }
  .terminal {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 10px;
    background: var(--canvas);
    border: 1px solid var(--border-strong);
    border-radius: 2px;
    flex: 1;
    min-width: 0;
  }
  .terminal:focus-within { border-color: var(--border-active); }
  .terminal .prompt { font-family: var(--mono); font-size: 13px; color: var(--accent); }
  .terminal input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: .01em;
    padding: 0;
  }

  button {
    font-family: var(--sans);
    font-size: 12.5px;
    cursor: default;
    border-radius: 2px;
  }
  .ghost {
    height: 34px;
    padding: 0 14px;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    color: #d4d4d8;
    flex: none;
  }
  .ghost:hover { background: var(--border); }

  /* 勾选项：自绘方框，未选=描边，选中=强调色填充 + 白勾 */
  .check {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 22px;
    font-size: 12.5px;
    color: #e4e4e7;
  }
  .check i { font-style: normal; color: var(--muted); }
  .check input { position: absolute; opacity: 0; pointer-events: none; }
  .check .box {
    width: 15px;
    height: 15px;
    border: 1px solid var(--border-active);
    border-radius: 2px;
    background: var(--canvas);
    display: grid;
    place-items: center;
    flex: none;
  }
  .check .box::after {
    content: "";
    width: 8px;
    height: 4.5px;
    border-left: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;
    transform: rotate(-45deg) translate(0.5px, -1px);
    opacity: 0;
  }
  .check input:checked + .box { background: var(--accent); border-color: var(--accent); }
  .check input:checked + .box::after { opacity: 1; }

  /* 日志控制台：安装时才有内容 */
  .console {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 8px 10px;
    background: var(--canvas);
    border: 1px solid var(--border);
    border-radius: 2px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 16px;
    color: #a1a1aa;
    white-space: pre;
    user-select: text;
  }
  .console .t { color: var(--muted); }
  .console .ok { color: var(--ok); }
  .console .warn { color: var(--warn); }

  /* 进度条：2px 贴边线 */
  .progress {
    height: 2px;
    background: var(--border);
    flex: none;
  }
  .progress .bar { height: 100%; width: 0; background: var(--accent); transition: width .18s linear; }

  /* ── 底部动作栏 ───────────────────────────────────────────────────── */
  footer {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 52px;
    padding: 0 18px;
    flex: none;
  }
  .status {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .08em;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status b { font-weight: 400; color: var(--accent); }
  footer .spacer { flex: 1; }
  .actions { display: flex; gap: 8px; flex: none; }
  .actions .ghost { height: 32px; }
  .solid {
    height: 32px;
    padding: 0 16px;
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #0b0b0d;
    font-weight: 600;
  }
  .solid:hover { filter: brightness(1.08); }
  .solid:disabled { opacity: .55; }

  /* 许可证入口：低调的文字按钮，装在底部动作栏 */
  .legal-open {
    height: 32px;
    padding: 0 8px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted-2);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .06em;
    white-space: nowrap;
  }
  .legal-open:hover { color: var(--text); border-color: var(--border); }

  /* 许可证弹层：占满窗口但不改窗口尺寸，正文可滚动、可选中复制 */
  .legal-overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    background: rgba(9, 9, 11, .86);
    --wails-draggable: no-drag;
  }
  .legal-overlay[hidden] { display: none; }
  .legal-panel {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-height: 100%;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 2px;
  }
  .legal-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .legal-head .title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .1em;
    color: var(--muted-2);
    text-transform: uppercase;
  }
  .legal-close {
    width: 24px;
    height: 24px;
    margin-left: auto;
    padding: 0;
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--muted-2);
    line-height: 1;
  }
  .legal-close:hover { color: #fff; border-color: var(--border-active); }
  .legal-tabs { display: flex; gap: 6px; padding: 8px 12px 0; flex: none; }
  .legal-tab {
    height: 24px;
    padding: 0 9px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted-2);
    font-family: var(--mono);
    font-size: 10.5px;
  }
  .legal-tab[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
  .legal-body {
    flex: 1;
    min-height: 0;
    margin: 8px 12px 12px;
    padding: 8px 10px;
    overflow: auto;
    background: var(--canvas);
    border: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 10.5px;
    line-height: 15px;
    color: #d4d4d8;
    white-space: pre-wrap;
    word-break: break-word;
    user-select: text;
  }

  /* 未开始安装时，日志区显示占位与就绪提示 */
  body[data-phase="ready"] .console { display: none; }
  body[data-phase="ready"] .progress { display: none; }
  body[data-phase="ready"] #statusText { color: var(--muted-2); }

  /* 运行中提示：与许可证弹层同风格，只保留确认动作 */
  .confirm-panel { max-width: 420px; }
  .confirm-body {
    padding: 12px 14px 4px;
    font-size: 12.5px;
    line-height: 19px;
    color: #d4d4d8;
  }
  .confirm-body p { margin: 0; }
  .confirm-body .confirm-note {
    margin-top: 7px;
    font-size: 11.5px;
    line-height: 16px;
    color: var(--muted);
  }
  .confirm-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 12px 14px 14px;
  }
  .confirm-actions .ghost, .confirm-actions .solid { height: 32px; }
</style>
</head>
<body data-phase="installing">
<div class="app">
  <header class="titlebar">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M13.5 2 4 14h6.5L9.5 22 20 9.5h-6.8L13.5 2Z"/>
    </svg>
    <span class="brand">CFST-GUI <span class="slash">//</span> 安装程序</span>
    <span class="spacer"></span>
    <span class="version">v{{VERSION}}</span>
    <button class="win-close" id="close" title="关闭">&#10005;</button>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1>CFST-GUI</h1>
        <p class="sub">Cloudflare 测速与优选 IP 控制面板</p>
      </div>
      <div class="pill" id="pill" data-state="{{WEBVIEW2_STATE}}">
        <span class="dot"></span>
        <span id="pillText">{{WEBVIEW2_TEXT}}</span>
      </div>
    </section>

    <section>
      <div class="label"><em>01</em> // 安装目录</div>
      <div class="fieldrow">
        <div class="terminal">
          <span class="prompt">&gt;</span>
          <input id="target" value="{{TARGET_DIR}}" spellcheck="false" autocomplete="off">
        </div>
        <button class="ghost" id="browse">浏览...</button>
      </div>
    </section>

    <section>
      <div class="label"><em>02</em> // 安装选项</div>
      <label class="check">
        <input type="checkbox" id="desktop" {{DESKTOP_CHECKED}}>
        <span class="box"></span>创建桌面快捷方式
      </label>
      <label class="check">
        <input type="checkbox" id="launch" {{LAUNCH_CHECKED}}>
        <span class="box"></span>安装完成后立即启动
      </label>
    </section>

    <section class="console" id="console"></section>

    <div class="progress"><div class="bar" id="bar"></div></div>
  </main>

  <footer>
    <div class="status">
      <span>状态：</span>
      <b id="statusText">正在安装...</b>
      <span id="statusMeta"></span>
    </div>
    <span class="spacer"></span>
    <div class="actions">
      <button class="legal-open" id="legalOpen" type="button" title="查看安装包内嵌的许可证">查看许可证</button>
      <button class="ghost" id="cancel">取消</button>
      <button class="solid" id="install" disabled>安装中...</button>
    </div>
  </footer>
</div>

<div class="legal-overlay" id="legalOverlay" hidden>
  <section class="legal-panel" role="dialog" aria-modal="true" aria-labelledby="legalTitle">
    <header class="legal-head">
      <span class="title" id="legalTitle">许可证</span>
      <button class="legal-close" id="legalClose" type="button" title="关闭">&#10005;</button>
    </header>
    <div class="legal-tabs" role="tablist">
      <button class="legal-tab" type="button" role="tab" data-name="LICENSE" aria-selected="true">GPL-3.0 许可证</button>
      <button class="legal-tab" type="button" role="tab" data-name="THIRD-PARTY-NOTICES.md" aria-selected="false">第三方声明</button>
    </div>
    <pre class="legal-body" id="legalBody" tabindex="0">加载中…</pre>
  </section>
</div>

<div class="legal-overlay" id="runningOverlay" hidden>
  <section class="legal-panel confirm-panel" role="dialog" aria-modal="true" aria-labelledby="runningTitle">
    <header class="legal-head">
      <span class="title" id="runningTitle">应用正在运行</span>
      <button class="legal-close" id="runningClose" type="button" title="关闭">&#10005;</button>
    </header>
    <div class="confirm-body">
      <p>检测到 CFST-GUI 正在运行。安装前需要先关闭它，是否关闭应用并继续安装？</p>
      <p class="confirm-note" id="runningNote">安装会先结束该安装目录下的应用进程。</p>
    </div>
    <div class="confirm-actions">
      <button class="ghost" id="runningCancel" type="button">取消</button>
      <button class="solid" id="runningConfirm" type="button">关闭应用并继续</button>
    </div>
  </section>
</div>

<script>
  // 页面有两个状态：ready（配置）和 installing（日志 + 进度）。
  // 真实运行由 Go 后端通过 /api/* 驱动；带 ?demo=installing 时用假数据渲染，
  // 方便在没有编译整个安装器的机器上比对设计稿。
  const $ = (id) => document.getElementById(id);
  const demo = new URLSearchParams(location.search).get('demo') === 'installing';
  const els = {
    log: $('console'), bar: $('bar'), status: $('statusText'), meta: $('statusMeta'),
    install: $('install'), cancel: $('cancel'), close: $('close'),
    target: $('target'), desktop: $('desktop'), launch: $('launch'), browse: $('browse'),
    legalOpen: $('legalOpen'), legalOverlay: $('legalOverlay'), legalClose: $('legalClose'), legalBody: $('legalBody'),
    runningOverlay: $('runningOverlay'), runningConfirm: $('runningConfirm'), runningCancel: $('runningCancel'),
    runningClose: $('runningClose'), runningNote: $('runningNote'),
  };
  let stream = null;

  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const clock = () => {
    const d = new Date();
    return String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0') + '.' +
      String(d.getMilliseconds()).padStart(3, '0').slice(0, 2);
  };

  function renderLine(text, tail, tailCls) {
    const row = document.createElement('div');
    row.innerHTML = '<span class="t">[' + clock() + ']</span> ' + esc(text) +
      (tail ? '<span class="' + tailCls + '">' + esc(tail) + '</span>' : '');
    els.log.appendChild(row);
    els.log.scrollTop = els.log.scrollHeight;
  }

  function setPhase(phase) { document.body.dataset.phase = phase; }

  function ready() {
    setPhase('ready');
    els.log.textContent = '';
    els.bar.style.width = '0';
    els.status.textContent = '等待安装';
    els.status.style.color = '';
    els.meta.textContent = '';
    els.install.disabled = false;
    els.install.textContent = '立即安装';
    els.cancel.textContent = '取消';
  }

  function post(path) {
    return fetch(path, { method: 'POST' }).catch(() => {});
  }

  async function openLegal(name) {
    els.legalOverlay.hidden = false;
    els.legalBody.textContent = '加载中…';
    for (const tab of document.querySelectorAll('.legal-tab')) {
      tab.setAttribute('aria-selected', String(tab.dataset.name === name));
    }
    if (demo) {
      els.legalBody.textContent = '演示模式：安装包构建后在此显示内嵌许可证原文。';
      return;
    }
    try {
      const res = await fetch('/api/legal?name=' + encodeURIComponent(name), { cache: 'no-store' });
      if (!res.ok) throw new Error((await res.text()).trim() || ('HTTP ' + res.status));
      els.legalBody.textContent = await res.text();
    } catch (err) {
      els.legalBody.textContent = '无法读取许可证：' + ((err && err.message) ? err.message : err);
    }
  }

  function closeLegal() {
    els.legalOverlay.hidden = true;
  }

  function finish(ok, message) {
    if (stream) { stream.close(); stream = null; }
    els.status.textContent = ok ? '安装完成' : '安装失败';
    els.status.style.color = ok ? '' : 'var(--danger)';
    els.meta.textContent = '';
    els.install.disabled = false;
    els.install.textContent = '关闭';
    els.install.dataset.action = 'close';
    if (message) renderLine(message, ok ? '成功' : '失败', ok ? 'ok' : 'warn');
  }

  // 安装前询问：目标程序正在运行时，先征得用户同意再关闭它。
  function askToCloseRunningApp() {
    return new Promise((resolve) => {
      const finishAsk = (value) => {
        els.runningOverlay.hidden = true;
        els.runningConfirm.disabled = false;
        els.runningConfirm.onclick = null;
        els.runningCancel.onclick = null;
        els.runningClose.onclick = null;
        resolve(value);
      };
      els.runningNote.textContent = '安装会先结束该安装目录下的应用进程。';
      els.runningConfirm.disabled = false;
      els.runningOverlay.hidden = false;
      els.runningCancel.onclick = () => finishAsk(false);
      els.runningClose.onclick = () => finishAsk(false);
      els.runningConfirm.onclick = async () => {
        els.runningConfirm.disabled = true;
        els.runningNote.textContent = '正在关闭应用…';
        try {
          const res = await fetch('/api/close-app?dir=' + encodeURIComponent(els.target.value), { method: 'POST' })
            .then((r) => r.json());
          if (!res || !res.closed) throw new Error((res && res.error) || '未能关闭应用');
          finishAsk(true);
        } catch (err) {
          els.runningConfirm.disabled = false;
          els.runningNote.textContent = '关闭失败：' + ((err && err.message) ? err.message : err) + '。请手动退出应用后重试。';
        }
      };
    });
  }

  async function closeRunningAppIfNeeded() {
    if (demo) return true;
    try {
      const state = await fetch('/api/running?dir=' + encodeURIComponent(els.target.value), { cache: 'no-store' })
        .then((r) => r.json());
      if (!state || !state.running) return true;
    } catch (_) {
      return true;
    }
    return askToCloseRunningApp();
  }

  async function startInstall() {
    if (els.install.disabled) return;
    els.install.disabled = true;
    if (!(await closeRunningAppIfNeeded())) {
      els.install.disabled = false;
      renderLine('已取消安装', '', '');
      return;
    }
    setPhase('installing');
    els.install.textContent = '安装中...';
    els.status.textContent = '正在安装...';
    els.meta.textContent = '';
    els.cancel.textContent = '取消';

    if (demo) {
      const lines = [
        ['正在检查 Microsoft Edge WebView2 运行时... ', '正常'],
        ['正在解压 cfst-gui.exe 到 ' + els.target.value + String.fromCharCode(92), ''],
        ['正在创建桌面快捷方式... ', '完成'],
        ['正在写入系统卸载信息... ', '完成'],
      ];
      lines.forEach(([t, tail], i) => setTimeout(() => {
        renderLine(t, tail, 'ok');
        els.bar.style.width = ((i + 1) * 20) + '%';
      }, 90 * i));
      setTimeout(() => { finish(true, '安装完成'); els.bar.style.width = '100%'; }, 520);
      return;
    }

    const q = new URLSearchParams({
      dir: els.target.value,
      desktop: String(els.desktop.checked),
      launch: String(els.launch.checked),
    });
    stream = new EventSource('/api/install?' + q.toString());
    stream.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.line) renderLine(data.line, '', '');
      if (typeof data.p === 'number') els.bar.style.width = data.p + '%';
      if (data.done) finish(!!data.ok, data.error || (data.cancelled ? '已取消' : ''));
    };
    stream.onerror = () => finish(false, '连接中断');
  }

  els.install.addEventListener('click', () => {
    if (els.install.dataset.action === 'close') { post('/api/close'); return; }
    startInstall();
  });
  els.cancel.addEventListener('click', () => {
    if (document.body.dataset.phase === 'installing') {
      if (!demo) post('/api/cancel');
      return;
    }
    post('/api/close');
  });

  els.close.addEventListener('click', () => post('/api/close'));

  els.legalOpen.addEventListener('click', () => openLegal('LICENSE'));
  els.legalClose.addEventListener('click', closeLegal);
  els.legalOverlay.addEventListener('click', (event) => {
    if (event.target === els.legalOverlay) closeLegal();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && !els.legalOverlay.hidden) closeLegal();
  });
  for (const tab of document.querySelectorAll('.legal-tab')) {
    tab.addEventListener('click', () => openLegal(tab.dataset.name));
  }

  els.browse.addEventListener('click', async () => {
    if (demo) return;
    const res = await fetch('/api/browse', { method: 'POST' }).then((r) => r.json()).catch(() => null);
    if (res && res.dir) els.target.value = res.dir;
  });

  ready();
  if (demo) startInstall();
</script>
</body>
</html>
