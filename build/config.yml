version: '3'

# wails3 dev 统一配置（./build/config.yml）：原生桌面窗口开发模式。
# 历史说明：这里曾是 webui 变体（go build -tags webui），v1.9.8 起默认改为桌面窗口，
# WebUI 调试请使用 bash scripts/dev/open-dev.sh webui。

info:
  companyName: ""
  productName: "CFST-GUI"
  productIdentifier: "io.github.axuitomo.cfst-gui"
  description: "Cloudflare/CDN IP 测速工具"
  version: "2.2.0"

dev_mode:
  root_path: .
  log_level: info
  debounce: 200
  ignore:
    dir:
      - .git
      - node_modules
      # packages/frontend 整体排除（与 Wails v3 官方模板一致）：前端改动只走 Vite HMR，
      # 否则 refresh watcher 会同时重建 Go 并重启应用，热更新被整体重启取代。
      - packages/frontend
      - build/bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      # packages/frontend 已排除，JS/TS 监视仅针对 //wails:include 嵌入的文件
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    # 先清场：上一次 wails3 dev 被强杀时留下的孤儿 vite 会继续监听端口，而 wails3 启动前
    # 会先探测该端口，占着就直接报错退出（看起来像「没反应、窗口还是旧的」）。
    # 只结束监听该端口的 node/vite 进程，其余情况只打印提示，详见脚本内注释。
    - cmd: node scripts/dev/free-dev-port.mjs
      type: once
    - cmd: pnpm --dir packages/frontend install --frozen-lockfile
      type: once
    - cmd: pnpm --dir packages/frontend dev
      type: background
    # 默认走原生桌面窗口：WebUI 变体改由 ./apps/webui 提供，debug 请用 `bash scripts/dev/open-dev.sh webui`。
    # -tags tray：窗口/托盘图标资源由 build/assets_tray.go 提供（//go:build tray），
    # 缺该标签时图标为 nil，窗口和任务栏会没有图标；带标签后 dev 也启用系统托盘。
    - cmd: go build -tags tray -o build/bin/cfst-gui-dev.exe ./apps/desktop
      type: blocking
    - cmd: .\build\bin\cfst-gui-dev.exe
      type: primary
