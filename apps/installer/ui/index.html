<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CFST-GUI 安装程序</title>
<link rel="stylesheet" href="installer.css">
</head>
<body data-phase="installing">
<div class="app">
  <header class="titlebar">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M13.5 2 4 14h6.5L9.5 22 20 9.5h-6.8L13.5 2Z"/>
    </svg>
    <span class="brand">CFST-GUI <span class="slash">//</span> 安装程序</span>
    <span class="spacer"></span>
    <span class="version">v{{VERSION}}</span>
    <button class="win-close" id="close" title="关闭">&#10005;</button>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1>CFST-GUI</h1>
        <p class="sub">Cloudflare 测速与优选 IP 控制面板</p>
      </div>
      <div class="pill" id="pill" data-state="{{WEBVIEW2_STATE}}">
        <span class="dot"></span>
        <span id="pillText">{{WEBVIEW2_TEXT}}</span>
      </div>
    </section>

    <section>
      <div class="label"><em>01</em> // 安装目录</div>
      <div class="fieldrow">
        <div class="terminal">
          <span class="prompt">&gt;</span>
          <input id="target" value="{{TARGET_DIR}}" spellcheck="false" autocomplete="off">
        </div>
        <button class="ghost" id="browse">浏览...</button>
      </div>
    </section>

    <section>
      <div class="label"><em>02</em> // 安装选项</div>
      <label class="check">
        <input type="checkbox" id="desktop" {{DESKTOP_CHECKED}}>
        <span class="box"></span>创建桌面快捷方式
      </label>
      <label class="check">
        <input type="checkbox" id="launch" {{LAUNCH_CHECKED}}>
        <span class="box"></span>安装完成后立即启动
      </label>
    </section>

    <section class="console" id="console"></section>

    <div class="progress"><div class="bar" id="bar"></div></div>
  </main>

  <footer>
    <div class="status">
      <span>状态：</span>
      <b id="statusText">正在安装...</b>
      <span id="statusMeta"></span>
    </div>
    <span class="spacer"></span>
    <div class="actions">
      <button class="legal-open" id="legalOpen" type="button" title="查看安装包内嵌的许可证">查看许可证</button>
      <button class="ghost" id="cancel">取消</button>
      <button class="solid" id="install" disabled>安装中...</button>
    </div>
  </footer>
</div>

<div class="legal-overlay" id="legalOverlay" hidden>
  <section class="legal-panel" role="dialog" aria-modal="true" aria-labelledby="legalTitle">
    <header class="legal-head">
      <span class="title" id="legalTitle">许可证</span>
      <button class="legal-close" id="legalClose" type="button" title="关闭">&#10005;</button>
    </header>
    <div class="legal-tabs" role="tablist">
      <button class="legal-tab" type="button" role="tab" data-name="LICENSE" aria-selected="true">GPL-3.0 许可证</button>
      <button class="legal-tab" type="button" role="tab" data-name="THIRD-PARTY-NOTICES.md" aria-selected="false">第三方声明</button>
    </div>
    <pre class="legal-body" id="legalBody" tabindex="0">加载中…</pre>
  </section>
</div>

<div class="legal-overlay" id="runningOverlay" hidden>
  <section class="legal-panel confirm-panel" role="dialog" aria-modal="true" aria-labelledby="runningTitle">
    <header class="legal-head">
      <span class="title" id="runningTitle">应用正在运行</span>
      <button class="legal-close" id="runningClose" type="button" title="关闭">&#10005;</button>
    </header>
    <div class="confirm-body">
      <p>检测到 CFST-GUI 正在运行。安装前需要先关闭它，是否关闭应用并继续安装？</p>
      <p class="confirm-note" id="runningNote">安装会先结束该安装目录下的应用进程。</p>
    </div>
    <div class="confirm-actions">
      <button class="ghost" id="runningCancel" type="button">取消</button>
      <button class="solid" id="runningConfirm" type="button">关闭应用并继续</button>
    </div>
  </section>
</div>

<script src="installer.js"></script>
</body>
</html>
