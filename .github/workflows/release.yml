name: Release

on:
  push:
    branches:
      - test
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: false
        default: "1.9.5"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/test' }}

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Resolve version and release channel
        id: release
        shell: bash
        env:
          BASE_VERSION: "1.9.5"
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "test" ]]; then
            VERSION="$BASE_VERSION-preview.$GITHUB_RUN_NUMBER"
          fi
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release version is invalid: $VERSION" >&2
            exit 1
          fi

          PRERELEASE=false
          if [[ "$REF_NAME" == "test" || "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"


  quality:
    name: Release quality gate
    needs:
      - metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26.7.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install quality dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck libwebkitgtk-6.0-dev libgtk-4-dev libpango1.0-dev libharfbuzz-dev libgdk-pixbuf-2.0-dev libcairo2-dev libvulkan-dev libgraphene-1.0-dev libsoup-3.0-dev libglib2.0-dev libjavascriptcoregtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16

      - name: Run release quality gate
        env:
          CFST_FORMAT_SCOPE: all
          CFST_REQUIRE_SHELLCHECK: "1"
        run: bash scripts/ci-local.sh
  desktop:
    name: Desktop ${{ matrix.target }}
    needs:
      - metadata
      - quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            asset: build/release/desktop/cfst-gui-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26.7.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16

      - name: Set up Windows packaging tools
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $nsis) {
            $candidate = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            if (Test-Path $candidate) {
              $nsis = Get-Item $candidate
            }
          }
          if (-not $nsis) {
            throw "makensis.exe not found after installing NSIS"
          }
          $nsisPath = if ($nsis.Source) { $nsis.Source } else { $nsis.FullName }
          Add-Content $env:GITHUB_PATH (Split-Path $nsisPath)
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signTool = Get-ChildItem $sdkRoot -Recurse -Filter SignTool.exe | Where-Object { $_.FullName -match "\\x64\\SignTool.exe$" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) {
            throw "Windows SDK SignTool.exe not found"
          }
          Add-Content $env:GITHUB_PATH (Split-Path $signTool.FullName)

      - name: Decode Windows signing certificate
        if: matrix.target == 'windows'
        shell: bash
        env:
          CFST_WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.CFST_WINDOWS_SIGNING_CERT_BASE64 }}
        run: |
          if [ -z "$CFST_WINDOWS_SIGNING_CERT_BASE64" ]; then
            echo "Missing CFST_WINDOWS_SIGNING_CERT_BASE64" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cfst-windows"
          echo "$CFST_WINDOWS_SIGNING_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cfst-windows/cfst-gui.pfx"

      - name: Build desktop asset
        shell: bash
        env:
          CFST_VERSION: ${{ needs.metadata.outputs.version }}
          CFST_WINDOWS_SIGNING_CERT: ${{ runner.temp }}/cfst-windows/cfst-gui.pfx
          CFST_WINDOWS_SIGNING_PASSWORD: ${{ secrets.CFST_WINDOWS_SIGNING_PASSWORD }}
        run: bash scripts/build-release.sh "${{ matrix.target }}"

      - name: Verify Windows asset version
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $asset = Get-Item 'build/release/desktop/cfst-gui-windows-amd64.exe'
          if ($asset.VersionInfo.ProductVersion) {
            if (-not $asset.VersionInfo.ProductVersion.StartsWith($env:EXPECTED_VERSION)) {
              throw "Windows asset version mismatch: expected $env:EXPECTED_VERSION, got $($asset.VersionInfo.ProductVersion)"
            }
            Write-Host "Verified Windows asset PE version: $($asset.VersionInfo.ProductVersion)"
          } else {
            Write-Host "Windows asset has no PE ProductVersion resource; application version is injected at build time as $env:EXPECTED_VERSION"
          }

      - name: Upload desktop asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  android:
    name: Android
    needs:
      - metadata
      - quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26.7.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "cmdline-tools;latest" "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          gomobile init

      - name: Install Wails Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkitgtk-6.0-dev libgtk-4-dev libpango1.0-dev libharfbuzz-dev libgdk-pixbuf-2.0-dev libcairo2-dev libvulkan-dev libgraphene-1.0-dev libsoup-3.0-dev libglib2.0-dev libjavascriptcoregtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16

      - name: Decode Android keystore
        env:
          CFST_ANDROID_KEYSTORE_BASE64: ${{ secrets.CFST_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CFST_ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing CFST_ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cfst-android"
          echo "$CFST_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cfst-android/release.jks"

      - name: Build Android asset
        env:
          CFST_VERSION: ${{ needs.metadata.outputs.version }}
          CFST_ANDROID_KEYSTORE: ${{ runner.temp }}/cfst-android/release.jks
          CFST_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CFST_ANDROID_KEYSTORE_PASSWORD }}
          CFST_ANDROID_KEY_ALIAS: ${{ secrets.CFST_ANDROID_KEY_ALIAS }}
          CFST_ANDROID_KEY_PASSWORD: ${{ secrets.CFST_ANDROID_KEY_PASSWORD }}
        run: bash scripts/build-release.sh android

      - name: Upload Android assets
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            build/release/android/cfst-gui-android-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Verify Android release asset
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging build/release/android/cfst-gui-android-arm64-v8a-release.apk | grep -F "versionName='$EXPECTED_VERSION'"
          "$AAPT" dump badging build/release/android/cfst-gui-android-arm64-v8a-release.apk | grep -F "native-code: 'arm64-v8a'"
          echo "Verified Android release asset for v$EXPECTED_VERSION"

  publish:
    name: Publish Release
    needs:
      - metadata
      - desktop
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: build/release/downloaded

      - name: Verify Windows and Android artifacts
        shell: bash
        run: |
          test -f build/release/downloaded/cfst-gui-windows-amd64.exe
          test -f build/release/downloaded/cfst-gui-android-arm64-v8a-release.apk
          echo "Verified Windows and Android artifacts for v${{ needs.metadata.outputs.version }}"

      - name: Arrange assets
        run: |
          mkdir -p build/release/desktop build/release/android
          mv build/release/downloaded/cfst-gui-windows-amd64.exe build/release/desktop/
          mv build/release/downloaded/cfst-gui-android-arm64-v8a-release.apk build/release/android/

      - name: Generate update manifest
        env:
          CFST_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          bash scripts/build-release.sh manifest

      - name: Prepare release notes
        run: |
          NOTES="docs/release-notes/v${{ needs.metadata.outputs.version }}.md"
          mkdir -p build/release
          if [ -f "$NOTES" ]; then
            cp "$NOTES" build/release/release-notes.md
          else
            printf "CFST-GUI %s\n" "${{ needs.metadata.outputs.version }}" > build/release/release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CFST-GUI ${{ needs.metadata.outputs.version }}
          body_path: build/release/release-notes.md
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.metadata.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            build/release/desktop/cfst-gui-windows-amd64.exe
            build/release/android/cfst-gui-android-arm64-v8a-release.apk
            build/release/cfst-gui-update-manifest.json
          fail_on_unmatched_files: true
