name: Android Release Resubmit

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: false
        default: "1.9.5"

permissions:
  contents: read


concurrency:
  group: android-resubmit-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RAW_VERSION:-1.9.5}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Release version must look like 1.9.5: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs:
      - metadata
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26.7.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "cmdline-tools;latest" "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          gomobile init

      - name: Install Wails system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkitgtk-6.0-dev libgtk-4-dev libpango1.0-dev libharfbuzz-dev libgdk-pixbuf-2.0-dev libcairo2-dev libvulkan-dev libgraphene-1.0-dev libsoup-3.0-dev libglib2.0-dev libjavascriptcoregtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16

      - name: Decode Android keystore
        env:
          CFST_ANDROID_KEYSTORE_BASE64: ${{ secrets.CFST_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CFST_ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing CFST_ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cfst-android"
          echo "$CFST_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cfst-android/release.jks"

      - name: Build Android APKs
        env:
          CFST_VERSION: ${{ needs.metadata.outputs.version }}
          CFST_ANDROID_KEYSTORE: ${{ runner.temp }}/cfst-android/release.jks
          CFST_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CFST_ANDROID_KEYSTORE_PASSWORD }}
          CFST_ANDROID_KEY_ALIAS: ${{ secrets.CFST_ANDROID_KEY_ALIAS }}
          CFST_ANDROID_KEY_PASSWORD: ${{ secrets.CFST_ANDROID_KEY_PASSWORD }}
        run: bash scripts/build-release.sh android

      - name: Verify Android APK output
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          APK=build/release/android/cfst-gui-android-arm64-v8a-release.apk
          test -f "$APK"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "versionName='$EXPECTED_VERSION'"
          "$AAPT" dump badging "$APK" | grep -F "native-code: 'arm64-v8a'"
          echo "Verified Android APK version and ABI: $EXPECTED_VERSION / arm64-v8a"
      - name: Rebuild update manifest and replace release assets
        env:
          CFST_VERSION: ${{ needs.metadata.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null
          mkdir -p build/release/desktop
          gh release download "$RELEASE_TAG" --pattern cfst-gui-windows-amd64.exe --dir build/release/desktop --clobber
          bash scripts/build-release.sh manifest
          bash scripts/artifact-inspect.sh --allow-missing
          gh release upload "$RELEASE_TAG" \
            build/release/android/cfst-gui-android-arm64-v8a-release.apk \
            build/release/cfst-gui-update-manifest.json \
            --clobber
      - name: Inspect release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: gh release view "$RELEASE_TAG" --json tagName,url,assets
