name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Full quality gate
    runs-on: ubuntu-latest
    env:
      CFST_FORMAT_SCOPE: changed
      CFST_REQUIRE_SHELLCHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install Wails system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkitgtk-6.0-dev libgtk-4-dev libpango1.0-dev libharfbuzz-dev libgdk-pixbuf-2.0-dev libcairo2-dev libvulkan-dev libgraphene-1.0-dev libsoup-3.0-dev libglib2.0-dev libjavascriptcoregtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0-nightly.20261028

      - name: Verify Go toolchain baseline
        run: bash scripts/checks/doctor.sh --strict

      - name: Install Go lint tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run local CI gate
        run: bash scripts/checks/ci-local.sh

  windows-compat:
    name: Windows compatibility
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"

      - name: Install Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0-nightly.20261028
          wails3 generate bindings

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        shell: pwsh
        run: |
          pnpm typecheck
          pnpm lint
          pnpm check:vapor
          pnpm lint:style
          pnpm lint:md
          pnpm lint:root
          pnpm build

      - name: Run Go tests
        shell: pwsh
        run: |
          $goPackages = @(go list ./... | Where-Object { $_ -notmatch '/frontend/node_modules(?:/|$)' })
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # -shuffle=on 打乱同包内测试顺序，抓隐式顺序依赖；失败时会打印复现用的种子。
          go test -shuffle=on $goPackages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # WebUI 构建标签不在默认构建中（发布流程用它构建 Linux WebUI 二进制），
          # 这里补跑一次标签测试，避免 webui 路径只在发布时才被编译。
          go test -tags webui ./internal/app/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 只对并发密集的包跑 -race：worker 池、事件流、任务运行时都在这些包里，
      # 全量 -race 会把 CI 时长翻倍，收益却集中在这几处。
      - name: Run Go tests with race detector
        shell: pwsh
        run: |
          go test -race -count=1 ./internal/task/ ./internal/appcore/ ./internal/probecore/ ./internal/app/

  android:
    name: Android compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # 不要用 android-actions/setup-android@v3：它无条件执行 `sdkmanager tools`，而 runner
      # 镜像的 cmdline-tools 16.0 已不再提供 `tools` 包（Failed to find package 'tools'），
      # 整个 job 会在这一步直接失败。runner 自带 Android SDK，只需把 cmdline-tools 与
      # platform-tools 加进 PATH。
      - name: Set up Android SDK
        run: |
          {
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          } >> "$GITHUB_ENV"
          {
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
            echo "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin"
            echo "$ANDROID_SDK_ROOT/platform-tools"
          } >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          { yes || true; } | sdkmanager --licenses >/dev/null
          sdkmanager "cmdline-tools;latest" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Install Wails system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkitgtk-6.0-dev libgtk-4-dev libpango1.0-dev libharfbuzz-dev libgdk-pixbuf-2.0-dev libcairo2-dev libvulkan-dev libgraphene-1.0-dev libsoup-3.0-dev libglib2.0-dev libjavascriptcoregtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0-nightly.20261028

      - name: Install dependencies and gomobile
        run: |
          pnpm install --frozen-lockfile
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          gomobile init

      - name: Build and check Android artifacts
        run: bash scripts/checks/check-android.sh

      - name: Run Kotlin lint (detekt; ktlint reports existing style debt)
        working-directory: mobile/android
        run: |
          ./gradlew detektDebug detektDebugUnitTest --console=plain
          # ktlint 1.5 standard rules conflict with existing code style (911 findings).
          # Gate is informational until style debt is paid down, then drop || true.
          ./gradlew ktlintMainSourceSetCheck --console=plain || true

  e2e:
    name: WebUI smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"

      - name: Install Wails system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkitgtk-6.0-dev libgtk-4-dev libpango1.0-dev libharfbuzz-dev libgdk-pixbuf-2.0-dev libcairo2-dev libvulkan-dev libgraphene-1.0-dev libsoup-3.0-dev libglib2.0-dev libjavascriptcoregtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0-nightly.20261028

      - name: Generate Wails frontend bindings
        run: wails3 generate bindings

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run WebUI smoke test
        run: pnpm exec playwright test --project=chromium
