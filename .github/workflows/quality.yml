name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Full quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 门禁定义只有一份：.github/actions/quality-gate 同时服务本工作流与 Release 工作流。
      # 不要在调用点补装工具或改环境变量，否则 tag 推送会重新引入「只在发布时才跑」的检查。
      - name: Run quality gate
        uses: ./.github/actions/quality-gate

  windows-compat:
    name: Windows compatibility
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Install Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.2.0-nightly.20261103
          wails3 generate bindings -d packages/frontend/bindings ./apps/desktop

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        shell: pwsh
        run: |
          pnpm typecheck
          pnpm lint
          pnpm check:vapor
          pnpm check:stringcode
          pnpm lint:style
          pnpm lint:md
          pnpm lint:root
          pnpm build

      - name: Check third-party notices
        shell: pwsh
        run: pnpm check:notices

      - name: Check canonical LICENSE
        shell: pwsh
        run: pnpm check:license

      - name: Install Chromium for layout regression
        shell: pwsh
        run: pnpm exec playwright install chromium

      # 视觉回归只断言与字体无关的几何关系(@layout):两端 Segoe UI 版本不同会让整页
      # 像素比对出现约 2% 的字形差异,所以不再保存 PNG 基线,也不需要在 CI 生成基线。
      - name: Run WebUI layout regression
        shell: pwsh
        run: pnpm test:layout

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-layout-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Run Go tests
        shell: pwsh
        run: |
          $goPackages = @(go list ./... | Where-Object { $_ -notmatch '/packages/frontend/node_modules(?:/|$)' })
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # -shuffle=on 打乱同包内测试顺序，抓隐式顺序依赖；失败时会打印复现用的种子。
          go test -shuffle=on $goPackages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/adapters/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 只对并发密集的包跑 -race：worker 池、事件流、任务运行时都在这些包里，
      # 全量 -race 会把 CI 时长翻倍，收益却集中在这几处。
      - name: Run Go tests with race detector
        shell: pwsh
        run: |
          go test -race -count=1 ./internal/kernel/domain/probe/task/ ./internal/kernel/appcore/ ./internal/kernel/domain/probe/probecore/ ./internal/adapters/...

  android:
    name: Android compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # 不要用 android-actions/setup-android@v3：它无条件执行 `sdkmanager tools`，而 runner
      # 镜像的 cmdline-tools 16.0 已不再提供 `tools` 包（Failed to find package 'tools'），
      # 整个 job 会在这一步直接失败。runner 自带 Android SDK，只需把 cmdline-tools 与
      # platform-tools 加进 PATH。
      - name: Set up Android SDK
        run: |
          {
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          } >> "$GITHUB_ENV"
          {
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
            echo "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin"
            echo "$ANDROID_SDK_ROOT/platform-tools"
          } >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          { yes || true; } | sdkmanager --licenses >/dev/null
          sdkmanager "cmdline-tools;latest" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Install Wails system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkitgtk-6.0-dev libgtk-4-dev libpango1.0-dev libharfbuzz-dev libgdk-pixbuf-2.0-dev libcairo2-dev libvulkan-dev libgraphene-1.0-dev libsoup-3.0-dev libglib2.0-dev libjavascriptcoregtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.2.0-nightly.20261103

      - name: Install dependencies and gomobile
        run: |
          pnpm install --frozen-lockfile
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          gomobile init

      - name: Build and check Android artifacts
        run: bash scripts/checks/check-android.sh

      - name: Run Kotlin lint (detekt; ktlint reports existing style debt)
        working-directory: apps/android
        run: |
          ./gradlew detektDebug detektDebugUnitTest --console=plain
          # ktlint 1.5 standard rules conflict with existing code style (911 findings).
          # Gate is informational until style debt is paid down, then drop || true.
          ./gradlew ktlintMainSourceSetCheck --console=plain || true

  e2e:
    name: WebUI smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Install Wails system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkitgtk-6.0-dev libgtk-4-dev libpango1.0-dev libharfbuzz-dev libgdk-pixbuf-2.0-dev libcairo2-dev libvulkan-dev libgraphene-1.0-dev libsoup-3.0-dev libglib2.0-dev libjavascriptcoregtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.2.0-nightly.20261103

      - name: Generate Wails frontend bindings
        run: wails3 generate bindings -d packages/frontend/bindings ./apps/desktop

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Vitest Browser Mode
        run: pnpm test:browser

      - name: Run WebUI DOM and Aria regression
        run: pnpm test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-failures
          path: |
            test-results/
            playwright-report/
            packages/frontend/.vitest/
          retention-days: 7
