# CodeQL 扫描配置。
#
# node_modules 里的 Capacitor Android 源码会被 Gradle 作为子项目一起编译，因此进入 Kotlin/Java
# 数据库并被扫描，报出的是第三方代码自身的问题（java/xss、java/error-message-exposure）。
# 依赖源码的问题交给依赖升级和 Dependabot 跟踪，不在这里重复报出。
# Gradle 子项目的源根在 apps/android，路径会带 ../../ 前缀，因此除仓库根相对路径外，
# 还需要 **/node_modules/** 才能匹配到 node_modules/.pnpm 下的模块源码。
name: "CFST-GUI CodeQL config"

paths-ignore:
  - "node_modules/**"
  - "**/node_modules/**"

# 本应用是单机桌面程序（WebUI 模式也仅允许本机回环或持有 CFST_WEBUI_TOKEN + 同源保护的请求）：
# 1. 本地路径由本机用户自己选择（原生对话框 / 安装器参数），写入者与被写目标同属当前用户权限；
#    安装器启动的是刚装进用户指定目录的主程序。
# 2. 通知邮件的头部已由 notify/emailHeaderValue 过滤 CR/LF，但 CodeQL 的
#    go/email-injection 未定义任何 sanitizer，无法用代码消除。
# 3. DoH 端点、WebDAV 服务器、Telegram API 网关和 Webhook 地址均由用户自行配置，代码侧已通过
#    httpclient.ValidateEndpointURL、BlockLinkLocal 拨号校验及 Telegram Bot Token/路径校验拦截
#    非 HTTP(S)、内嵌凭据、控制字符与链路本地/云元数据地址（169.254.169.254 等）；但 CodeQL 的
#    go/request-forgery 仅将常量域名白名单视为 sanitizer，无法识别用户自选外部端点的校验函数。
# 这四条规则在本仓库只会重复报同一批已落地边界校验或逐条登记豁免的结果，因此按规则 ID 关闭。
# 只屏蔽这四条：其他规则的错误级结果仍然照常上报，新增规则也能被看到。
# 什么时候重开：一旦出现跨权限写入路径（例如新增守护进程、以其他用户身份运行、
# 允许非本机无鉴权请求指定写入路径或出站请求目标），必须删掉对应 exclude 重新扫描一次。
query-filters:
  - exclude:
      id: go/path-injection
  - exclude:
      id: go/command-injection
  - exclude:
      id: go/email-injection
  - exclude:
      id: go/request-forgery
